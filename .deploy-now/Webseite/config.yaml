# IONOS Deploy Now – Deployment-Konfiguration
# https://docs.ionos.space/docs/deployment-configuration/
#
# Der Build laedt mit DEPLOYMENT_FOLDER "./" das komplette Repository hoch.
# Ohne diese Excludes landen Entwicklungsdateien im oeffentlichen Webroot.
# .git, .github, .deploy-now und logs schliesst Deploy Now bereits selbst aus.

bootstrap:
  excludes:
    - .claude
    - .agents
    - CLAUDE.md
    - skills-lock.json

recurring:
  excludes:
    - .claude
    - .agents
    - CLAUDE.md
    - skills-lock.json
